<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GYMAPP - Progress Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Navigation -->
    <nav>
        <div class="container nav-inner">
            <div class="logo">GYMAPP</div>
            <div class="nav-links">
                <a href="#">Home</a>
                <a href="#">Membership</a>
                <a href="#" class="active">Progress</a>
                <a href="#">Workouts</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container">

        <!-- Top Stat Grid -->
        <div class="top-grid">
            
            <!-- Left Column Stats -->
            <div class="left-col">
                
                <!-- Stat 1: Total Workout Done -->
                <div class="card stat-card">
                    <div class="stat-label">Total Workout Done</div>
                    <div class="stat-value">150 Workouts</div>
                    <div class="stat-trend">
                        <span class="trend-up">
                            ⬆ 10%
                        </span>
                        <span class="trend-text">vs last month</span>
                    </div>
                </div>
</body>
</html>
