<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#171717">
    <title>GymTrack</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel ="stylesheet" href = "styles/style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

   <!-- Nav Bar Section -->
   <header>
        <nav class="navbar">
            <p id="navbar-title">GymTrack</p>
            <ul class="navbar-list">
                <li class="navbar-item"><a href="index.html">Home</a></li>
                <li class="navbar-item"><a href="membership.html">Membership</a></li>
                <li class="navbar-item"><a href="progress.html">Progress</a></li>
                <li class="navbar-item"><a href="workout.html">Workouts</a></li>
            </ul>
            <img src="Images/UserProfile.jpeg" alt="user-profile">
        </nav>
    </header>

    <main id="home-section">
        <div id="home">
            <h1>UNLEASH YOUR POTENTIAL</h1>
            <p>Track Your Fitness Now</p>
        </div>
        

        <div id="home-cards">

        <div id="check-in"> 
            <div id="check-in-container">
                <h1>READY TO CHECK-IN?</h1>
                <p>Scan Member QR Code to Get Started</p>

                <div id="check-in-border">
                    <div id="gym-qr-code"></div>
                </div>
            </div>
            <p id="checkin-status" aria-live="polite"></p>
            <p id="member-result" role="status" aria-live="polite"></p>
        </div>

        <div id="membership-container">
            <div id="membership-text">
            <h1>FLEXIBLE MEMBERSHIP</h1>
            <p>Not yet a member?</p>
            <p class="button"><a href="membership.html">Start Your Journey</a></p>
            </div>
        </div>

        </div>
    </main>
    
  <script src="js/nav.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/loading.js"></script>
  <script src="js/app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="js/generate-qr.js"></script>

</body>
</html>
