<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#171717">
    <title>GymTrack</title>
    <link rel ="stylesheet" href = "styles/style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

   <!-- Nav Bar Section -->
   <header>
        <nav class="navbar">
            <p id="navbar-title">GymTrack</p>
            <ul class="navbar-list">
                <li class="navbar-item"><a href="index.html">Home</a></li>
                <li class="navbar-item"><a href="membership.html">Membership</a></li>
                <li class="navbar-item"><a href="progress.html">Progress</a></li>
                <li class="navbar-item"><a href="workout.html">Workouts</a></li>
            </ul>
            <img src="Images/UserProfile.jpeg" alt="user-profile">
        </nav>
    </header>

    <main id="home-section">
        <div id="home">
            <h1>UNLEASH YOUR POTENTIAL</h1>
            <p>track your fitness now.</p>
        </div>
        

        <div id="check-in"> 
            <h1>READY TO CHECK-IN?</h1>
            <p>Scan member QR code to get started.</p> 

            <div id="check-in-border">
                <img src="./Images/Qr-Code.png" alt="Qr-Code Image">
            </div>
        </div>

        <div id="membership-container">
            <div id="membership-text">
            <h1>FLEXIBLE MEMBERSHIP</h1>
            <p>Not yet a member?</p>
            <p class="button"><a href="membership.html">Start your journey.</a></p>
            </div>
        </div>
    </main>
    
    <!-- service worker for manifest.json -->
    <script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", async () => {
      try {
        const registration =
          await navigator.serviceWorker.register(
            "./service-worker.js"
          );

        console.log(
          "GymTrack service worker registered:",
          registration.scope
        );
      } catch (error) {
        console.error(
          "GymTrack service worker registration failed:",
          error
        );
      }
    });
  }
</script>

  <script src="js/nav.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/loading.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/qr-code.js"></script>

</body>
</html>
